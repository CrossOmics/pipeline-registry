name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Fetch the last collected metrics
        run: |
          mkdir -p .metrics
          if git fetch --depth=1 origin data; then
            git show origin/data:metrics/latest.json > .metrics/latest.json || rm -f .metrics/latest.json
          fi
      - run: uv run python -m registry_tools build --metrics .metrics/latest.json --out dist --registry-commit "${{ github.sha }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
