name: collect
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: .data
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python -m registry_tools collect --metrics-dir .data/metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_CONTACT_EMAIL: ${{ vars.REGISTRY_CONTACT_EMAIL }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      - name: Commit metrics to the data branch
        working-directory: .data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics
          git commit -m "Metrics $(date -u +%F)" || echo "No metric changes"
          git push origin HEAD:data
      - run: uv run python -m registry_tools build --metrics .data/metrics/latest.json --out dist --registry-commit "${{ github.sha }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
