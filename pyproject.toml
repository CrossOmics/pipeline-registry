[project]
name = "pipeline-registry"
version = "0.1.0"
description = "CrossOmics community pipeline registry tools"
requires-python = ">=3.11,<3.12"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
